spring.application.name=ivoneide-pintura-api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ivoneide-pintura-api}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:mari}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

security.jwt.secret=${JWT_SECRET:ivoneide-pintura-api-dev-secret-key-change-me-2026}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
